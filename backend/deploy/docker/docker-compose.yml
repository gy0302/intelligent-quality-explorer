services:
  postgres:
    image: postgres:15-alpine
    container_name: aqes-test-postgres
    environment:
      POSTGRES_USER: aqes_test_user
      POSTGRES_PASSWORD: aqes_test_password
      POSTGRES_DB: aqes_test_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/database/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqes_test_user -d aqes_test_db"]
      interval: 30s
      timeout: 10s
      retries: 3
