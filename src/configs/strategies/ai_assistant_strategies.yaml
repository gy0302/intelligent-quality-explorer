# 测试生成策略配置
version: "1.0"
name: "test_generation_strategies"
description: "测试生成策略配置"

strategies:
  functional_testing:
    name: "功能测试策略"
    description: "生成功能测试用例的策略"
    categories:
      - name: "正向测试"
        coverage: 40%
        priority: "高"
        rules:
          - "验证API正常功能"
          - "使用有效输入数据"
          - "预期正常响应"

      - name: "边界测试"
        coverage: 25%
        priority: "中"
        rules:
          - "测试输入边界值"
          - "测试最小/最大值"
          - "测试空值/零值"

      - name: "异常测试"
        coverage: 20%
        priority: "中"
        rules:
          - "测试无效输入"
          - "测试权限不足"
          - "测试资源不存在"

      - name: "安全测试"
        coverage: 10%
        priority: "高"
        rules:
          - "SQL注入测试"
          - "XSS测试"
          - "认证授权测试"

      - name: "性能测试"
        coverage: 5%
        priority: "低"
        rules:
          - "响应时间测试"
          - "并发测试"
          - "负载测试"

  test_coverage:
    name: "测试覆盖率策略"
    targets:
      api_endpoint_coverage: 100%
      parameter_coverage: 90%
      response_code_coverage: 95%
      business_scenario_coverage: 85%
    rules:
      - "每个API端点至少有一个测试用例"
      - "每个必需参数至少有两个测试用例（有效/无效）"
      - "每个响应状态码至少有一个测试用例"
      - "每个业务场景至少有一个端到端测试"

  test_priority_assignment:
    name: "测试优先级分配策略"
    rules:
      - "涉及用户数据/PII的API -> 优先级: 高"
      - "涉及支付/交易的API -> 优先级: 高"
      - "写操作(POST/PUT/DELETE) -> 优先级: 中-高"
      - "读操作(GET) -> 优先级: 中-低"
      - "管理功能API -> 优先级: 高"
      - "公共API -> 优先级: 中"
    factors:
      - "业务重要性"
      - "安全风险"
      - "使用频率"
      - "变更频率"

  ai_generation:
    name: "AI生成策略"
    model_selection:
      default: "gpt-4-turbo-preview"
      fallback: "gpt-3.5-turbo"
      backup: "claude-3-opus"
    quality_control:
      temperature: 0.3
      max_tokens: 4000
      retry_attempts: 3
      validation_required: true
    optimization:
      batch_size: 5
      parallel_generation: true
      cache_enabled: true
      cache_ttl: 3600