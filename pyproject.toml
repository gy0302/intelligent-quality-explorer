
[project]
name = "smart-intelligent-testing-pro"
version = "0.1.0"
description = "智能接口自动化测试生成平台"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.104.0",
    "streamlit>=1.28.0",
    "openapi-spec-validator>=0.5.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest-asyncio", "black", "isort", "mypy", "pre-commit"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88